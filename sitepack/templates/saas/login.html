{% extends "saas/base.html" %}
{% block title %}Přihlášení — SitePack Pro{% endblock %}
{% block content %}
<div class="box" style="max-width:420px;margin:0 auto">
  <h2>Přihlášení</h2>
  <p class="hint">Demo: <code>demo@sitepack.cz</code> / <code>demo</code></p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required placeholder="demo@sitepack.cz"/>
    <label for="password">Heslo</label>
    <input id="password" name="password" type="password" required/>
    <p style="margin-top:16px"><button class="btn" type="submit">Přihlásit</button></p>
  </form>
  <p class="stub-note">Nemáte účet? <a href="/register">Registrace</a></p>
</div>
{% endblock %}
