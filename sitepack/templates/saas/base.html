<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}SitePack Pro{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/app.css"/>
</head>
<body>
<div class="shell">
  <nav class="nav">
    <a class="brand" href="/">SitePack <span>Pro</span></a>
    <div class="nav-links">
      <a href="/">Úvod</a>
      <a href="/app">Rešerše</a>
      {% if user %}
        <span class="user-chip">{{ user.name }} · {{ user.email }}</span>
        <a href="/logout">Odhlásit</a>
      {% else %}
        <a href="/login">Přihlášení</a>
        <a href="/register">Registrace</a>
      {% endif %}
    </div>
  </nav>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    Orientační vrstvy · bez vlastnictví KN · ne Verido/homebuyer tool.
  </footer>
</div>
</body>
</html>
