{% extends "base.html" %}
{% block title %}{{ alert.subject }} — WasteGate{% endblock %}
{% block content %}
<section class="card">
  <p><a href="/alerts">← Alerts</a></p>
  <h1>{{ alert.subject }}</h1>
  <p class="muted">{{ alert.createdAt }} · {{ alert.kind }}</p>
  <h2>Email preview</h2>
  <pre class="email">Subject: {{ alert.subject }}

{{ alert.body }}</pre>
</section>
{% endblock %}
