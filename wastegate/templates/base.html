<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}WasteGate{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <header class="top">
    <a class="brand" href="{% if user %}/dashboard{% else %}/{% endif %}">Waste<span>Gate</span></a>
    {% if user %}
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/watchlist">Watchlist</a>
      <a href="/alerts">Alerty</a>
      <form method="post" action="/logout" class="inline"><button type="submit">Odhlásit</button></form>
      <span class="muted">{{ user.email }}</span>
    </nav>
    {% else %}
    <nav>
      <a href="/login">Přihlášení</a>
      <a href="/signup">Registrace</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="foot"><p>{{ FOOTER }}</p></footer>
</body>
</html>
