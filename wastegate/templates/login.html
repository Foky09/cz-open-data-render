{% extends "base.html" %}
{% block title %}Přihlášení — WasteGate{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Přihlášení</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>E-mail <input type="email" name="email" value="demo@wastegate.cz" required/></label>
    <label>Heslo <input type="password" name="password" value="demo1234" required/></label>
    <p style="margin-top:16px"><button type="submit">Přihlásit se</button></p>
  </form>
  <p class="muted">Demo: <code>demo@wastegate.cz</code> / <code>demo1234</code> · <a href="/">Landing</a> · <a href="/signup">Registrace</a></p>
</section>
{% endblock %}
