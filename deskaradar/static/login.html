<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeskaRadar — Přihlášení</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper:#F7F4EF; --ink:#1C1917; --muted:#78716C; --line:#E7E0D6;
      --accent:#E07A5F; --accent-dark:#C45D42; --card:#FFFCFA; --fail:#B91C1C;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:"Nunito Sans",system-ui,sans-serif; color:var(--ink);
      background:var(--paper);
      background-image: radial-gradient(circle, rgba(224,122,95,.28) 1.2px, transparent 1.3px);
      background-size:18px 18px;
    }
    .card {
      width:min(420px,92vw); background:var(--card); border:2px solid var(--ink);
      border-radius:24px; padding:1.75rem; box-shadow:6px 6px 0 rgba(224,122,95,.35);
    }
    h1 { font-family:"Fraunces",Georgia,serif; margin:0 0 .35rem; font-size:1.6rem; }
    h1 span { color:var(--accent); }
    p { margin:0 0 1.1rem; color:var(--muted); font-size:.95rem; }
    label { display:block; font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.3rem; font-weight:700; }
    input {
      width:100%; margin-bottom:.9rem; padding:.65rem .75rem; border-radius:14px;
      border:1.5px solid var(--line); background:#fff; color:var(--ink); font:inherit;
    }
    input:focus { outline:2px solid var(--accent); border-color:var(--accent); }
    button {
      width:100%; padding:.75rem; border:2px solid var(--ink); border-radius:999px;
      background:var(--accent); color:#fff; font-weight:700; font:inherit; cursor:pointer;
      box-shadow:3px 3px 0 var(--ink);
    }
    button:hover { filter:brightness(1.05); }
    .err { color:var(--fail); font-size:.85rem; min-height:1.2em; margin-bottom:.5rem; }
    .hint { margin-top:1rem; font-size:.8rem; color:var(--muted); }
    code { background:#F0EBE3; padding:.1em .35em; border-radius:4px; }
    .back { display:block; text-align:center; margin-top:1rem; color:var(--muted); font-size:.85rem; text-decoration:none; }
    .back:hover { color:var(--accent-dark); }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>Deska<span>Radar</span></h1>
    <p>Demo přihlášení — leady z JMK úředních desek.</p>
    <div class="err" id="err"></div>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" value="demo@deskaradar.local" required />
    <label for="password">Heslo</label>
    <input id="password" type="password" autocomplete="current-password" value="demo" required />
    <button type="submit">Přihlásit se</button>
    <div class="hint">Demo: libovolný e-mail + heslo <code>demo</code>.</div>
    <a class="back" href="/">← Zpět na landing</a>
  </form>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          err.textContent = data.error || "Přihlášení selhalo";
          return;
        }
        location.href = "/app";
      } catch (ex) {
        err.textContent = String(ex);
      }
    });
  </script>
</body>
</html>
